<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaOnline - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">⚙️ Admin Panel</a>
            <a href="home.html" class="btn btn-outline-light btn-sm">Store Front</a>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between mb-3">
            <h4>Inventory Management</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">+ Add Medicine</button>
        </div>
        <div class="card p-3 border-0 shadow-sm">
            <table class="table align-middle">
                <thead><tr><th>ID</th><th>Name</th><th>Stock Count</th><th>Expiry Date</th><th>Action</th></tr></thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><strong>Panadol Extra 500mg</strong></td>
                        <td><input type="number" class="form-control form-control-sm w-50" value="120"></td>
                        <td><input type="date" class="form-control form-control-sm" value="2027-12-31"></td>
                        <td><button class="btn btn-sm btn-outline-success" onclick="alert('Updated!')">Update</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
