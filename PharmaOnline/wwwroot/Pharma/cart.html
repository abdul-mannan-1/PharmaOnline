<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaOnline - Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between mb-4">
            <h3 class="fw-bold">Shopping Cart</h3>
            <a href="home.html" class="btn btn-outline-primary">&larr; Back to Catalog</a>
        </div>
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card p-3 border-0 shadow-sm">
                    <table class="table align-middle">
                        <thead><tr><th>Medicine</th><th>Price</th><th>Expiry Date</th><th>Qty</th><th>Subtotal</th></tr></thead>
                        <tbody>
                            <tr>
                                <td><strong>Panadol Extra 500mg</strong></td>
                                <td>Rs. 250</td>
                                <td>2027-12-31</td>
                                <td>2</td>
                                <td class="fw-bold">Rs. 500</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card p-4 border-0 shadow-sm">
                    <h5 class="fw-bold mb-3">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2"><span>Total</span><span class="fw-bold text-primary fs-5">Rs. 500</span></div>
                    <button class="btn btn-success btn-lg w-100 fw-bold mt-3" onclick="/* Place order button does nothing */">Place Order</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
