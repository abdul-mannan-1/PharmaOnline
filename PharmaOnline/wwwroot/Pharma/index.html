<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaOnline - Login & Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            background: #ffffff;
        }

        .brand-header {
            color: #0d6efd;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card auth-card p-4 my-4">
        <div class="text-center mb-4">
            <h3 class="brand-header m-0">💊 PharmaOnline</h3>
            <p class="text-muted small mt-1">Sign in to manage and order your healthcare needs</p>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='home.html';">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email address</label>
                <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Sign In</button>
        </form>

        <div class="text-center pt-3 border-top">
            <span class="small text-muted me-2">Don't have an account yet?</span>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</button>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal fade" id="signupModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-primary">Create Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form onsubmit="event.preventDefault(); alert('Account created!'); window.location.href='home.html';">
                        <div class="mb-3"><label class="form-label small fw-semibold">Full Name</label><input type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label small fw-semibold">Email address</label><input type="email" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label small fw-semibold">Address</label><textarea class="form-control" rows="2" required></textarea></div>
                        <div class="mb-3"><label class="form-label small fw-semibold">Password</label><input type="password" class="form-control" required></div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Register & Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
