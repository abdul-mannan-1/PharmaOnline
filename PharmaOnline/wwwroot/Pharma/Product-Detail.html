<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaOnline - Medicine Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .price-tag {
            color: #f57224;
            font-size: 2rem;
            font-weight: 700;
        }

        .daraz-btn-add {
            background-color: #FFD7B5;
            color: #f57224;
            font-weight: 600;
            border: 1px solid #ffbe9d;
        }

        .daraz-btn-buy {
            background-color: #49CFF0;
            color: #000000;
            font-weight: 600;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <a href="home.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Search</a>
        <div class="card p-4 border-0 shadow-sm">
            <div class="row g-4">
                <div class="col-md-5 text-center bg-light p-4 rounded">
                    <img id="medImage" src="https://via.placeholder.com/350x280?text=Medicine" class="img-fluid rounded">
                </div>
                <div class="col-md-7">
                    <h2 id="medTitle" class="fw-bold">Panadol Extra 500mg</h2>
                    <p id="medFormula" class="text-muted">Formula: Paracetamol / Caffeine</p>
                    <div class="mb-3"><span class="price-tag">Rs. <span id="medPrice">250</span></span></div>

                    <div class="card bg-light border-0 p-3 mb-3">
                        <div class="row text-center">
                            <div class="col-6 border-end"><small class="text-muted d-block">Stock Count</small><strong id="medStock" class="text-success">In Stock (120)</strong></div>
                            <div class="col-6"><small class="text-muted d-block">Expiry Date</small><strong id="medExpiry" class="text-danger">2027-12-31</strong></div>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button onclick="alert('Added to cart!');" class="btn daraz-btn-add btn-lg px-4 flex-fill">🛒 Add to Cart</button>
                        <a href="cart.html" class="btn daraz-btn-buy btn-lg px-4 flex-fill text-center">Buy Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
